apiVersion: v1
kind: Namespace
metadata:
  name: production
---
# Apply this FIRST to any namespace you want to lock down.
# This drops ALL ingress and egress from every pod in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: production
spec:
  podSelector: {}   # {} = matches ALL pods in the namespace
  policyTypes:
  - Ingress
  - Egress
