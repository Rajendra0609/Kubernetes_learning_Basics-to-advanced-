# ============================================================
# KEDA — Kubernetes Event-Driven Autoscaling
# ============================================================
# KEDA extends HPA to scale on external events:
#   SQS queue depth, Kafka consumer lag, Redis list length,
#   Prometheus metrics, Cron schedules, HTTP request rate, etc.
#
# Install:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm install keda kedacore/keda --namespace keda --create-namespace
# ============================================================

# ── Scale on AWS SQS Queue Depth ─────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sqs-worker-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: sqs-worker                  # Deployment to scale
  pollingInterval: 15                 # check every 15 seconds
  cooldownPeriod: 300                 # wait 5 min before scaling down
  minReplicaCount: 0                  # KEDA can scale to ZERO (saves cost)
  maxReplicaCount: 50
  triggers:
  - type: aws-sqs-queue
    authenticationRef:
      name: keda-aws-credentials
    metadata:
      queueURL: https://sqs.ap-south-1.amazonaws.com/123456789/my-queue
      queueLength: "5"               # scale up when >5 messages per replica
      awsRegion: ap-south-1
      scaleOnInFlight: "true"
---
# ── Scale on Kafka Consumer Lag ───────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: kafka-consumer
  minReplicaCount: 1
  maxReplicaCount: 20
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-service:9092
      consumerGroup: my-consumer-group
      topic: orders
      lagThreshold: "100"            # 1 replica per 100 messages of lag
      offsetResetPolicy: latest
---
# ── Scale on Prometheus Metric ────────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: prometheus-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: api-server
  minReplicaCount: 2
  maxReplicaCount: 30
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
      metricName: http_requests_per_second
      threshold: "100"               # scale when >100 req/s per replica
      query: sum(rate(http_requests_total{job="api-server"}[1m]))
---
# ── Cron-based scaling (business hours) ──────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cron-scaler
  namespace: production
spec:
  scaleTargetRef:
    name: webapp
  triggers:
  - type: cron
    metadata:
      timezone: Asia/Kolkata          # IST
      start: 0 8 * * 1-5             # 8 AM Mon-Fri (business hours start)
      end: 0 20 * * 1-5              # 8 PM Mon-Fri (business hours end)
      desiredReplicas: "10"          # scale up during business hours
  - type: cron
    metadata:
      timezone: Asia/Kolkata
      start: 0 20 * * 1-5            # 8 PM: scale down
      end: 0 8 * * 1-5
      desiredReplicas: "2"
---
# ── TriggerAuthentication for AWS ────────────────────────────
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: production
spec:
  podIdentity:
    provider: aws-eks               # use IRSA (no static credentials!)
