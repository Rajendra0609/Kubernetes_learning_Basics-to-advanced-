# PDB using minAvailable: at least 2 pods must always be running
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webapp-pdb
  namespace: production
spec:
  minAvailable: 2    # Absolute count
  selector:
    matchLabels:
      app: webapp
---
# PDB using maxUnavailable: at most 1 pod can be down at a time
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: production
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: api-service
---
# PDB using percentage – scales with replica count
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-pdb
  namespace: production
spec:
  minAvailable: "50%"    # At least 50% must be available at all times
  selector:
    matchLabels:
      app: worker
