# ============================================================
# Multi-Tenancy — Namespace Isolation, Network Policies, Quotas
# ============================================================
# Pattern: Each team gets a namespace with:
#   1. ResourceQuota — prevents noisy-neighbour CPU/memory abuse
#   2. LimitRange — enforces per-pod defaults
#   3. NetworkPolicy — blocks cross-namespace traffic by default
#   4. RBAC — team members can only manage their own namespace
# ============================================================

# ── Team Alpha namespace setup ────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: team-alpha
  labels:
    team: alpha
    env: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-alpha-quota
  namespace: team-alpha
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
    services: "15"
    persistentvolumeclaims: "10"
    count/deployments.apps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-alpha-limits
  namespace: team-alpha
spec:
  limits:
  - type: Container
    defaultRequest: { cpu: "100m", memory: "128Mi" }
    default:        { cpu: "500m", memory: "256Mi" }
    max:            { cpu: "4",    memory: "8Gi" }
    min:            { cpu: "10m",  memory: "16Mi" }
---
# ── Default-deny all ingress in team-alpha ────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: team-alpha
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# ── Allow intra-namespace traffic ────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: team-alpha
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}    # any pod in the same namespace
---
# ── Allow ingress from nginx ingress controller ───────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: team-alpha
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
---
# ── Allow DNS resolution (kube-system) ───────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: team-alpha
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
---
# ── Team RBAC — team members manage only their namespace ──────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-developer
  namespace: team-alpha
rules:
- apiGroups: ["", "apps", "batch", "autoscaling"]
  resources:
  - pods, pods/log, pods/exec
  - deployments, replicasets, statefulsets
  - services, configmaps
  - jobs, cronjobs
  - horizontalpodautoscalers
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]       # can read secrets but not create/delete
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-alpha-developers
  namespace: team-alpha
roleRef:
  kind: Role
  name: team-developer
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: Group
  name: team-alpha-engineers    # maps to OIDC/SSO group
  apiGroup: rbac.authorization.k8s.io
