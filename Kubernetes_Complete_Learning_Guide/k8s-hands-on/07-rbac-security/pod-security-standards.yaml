# ============================================================
# Pod Security Standards (PSS) — Replaced PodSecurityPolicy
# ============================================================
# PSS has three profiles:
#   privileged: unrestricted (for system workloads)
#   baseline:   prevents known privilege escalations
#   restricted: hardened, best-practice security
#
# Enforced via namespace labels (built-in, no webhook needed):
# ============================================================

# ── Label namespaces to enforce PSS ──────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    # ENFORCE restricted policy — pods violating this are REJECTED
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # AUDIT — violations logged but NOT rejected
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    # WARN — violations show a warning to the user
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# ── Example: Pod that satisfies 'restricted' profile ─────────
apiVersion: v1
kind: Pod
metadata:
  name: restricted-compliant-pod
  namespace: production
spec:
  securityContext:
    runAsNonRoot: true          # required by restricted
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault      # required by restricted
  containers:
  - name: app
    image: nginx:1.25-unprivileged
    ports:
    - containerPort: 8080
    securityContext:
      allowPrivilegeEscalation: false   # required
      readOnlyRootFilesystem: true       # best practice
      capabilities:
        drop: [ALL]             # required by restricted
        # add: [NET_BIND_SERVICE]  # only if port < 1024 needed
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 256Mi }
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: var-cache
      mountPath: /var/cache/nginx
    - name: var-run
      mountPath: /var/run
  volumes:
  - name: tmp
    emptyDir: {}
  - name: var-cache
    emptyDir: {}
  - name: var-run
    emptyDir: {}
---
# ── OPA Gatekeeper — Policy-as-Code beyond PSS ───────────────
# Install: helm install gatekeeper opa/gatekeeper -n gatekeeper-system
# 
# ConstraintTemplate defines a new policy type:
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequiredlabels
spec:
  crd:
    spec:
      names:
        kind: K8sRequiredLabels
      validation:
        openAPIV3Schema:
          type: object
          properties:
            labels:
              type: array
              items:
                type: string
  targets:
  - target: admission.k8s.gatekeeper.sh
    rego: |
      package k8srequiredlabels
      violation[{"msg": msg}] {
        provided := {label | input.review.object.metadata.labels[label]}
        required := {label | label := input.parameters.labels[_]}
        missing := required - provided
        count(missing) > 0
        msg := sprintf("Missing required labels: %v", [missing])
      }
---
# Constraint: enforce that all Deployments have required labels
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredLabels
metadata:
  name: require-deployment-labels
spec:
  match:
    kinds:
    - apiGroups: [apps]
      kinds: [Deployment]
    namespaces: [production, staging]
  parameters:
    labels: [app, team, version]
---
# ── NetworkPolicy: deny all + allow only necessary ────────────
# Complementary to RBAC — controls network-level access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: production-default-deny
  namespace: production
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
  # Allow DNS
  - ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
  # Allow within namespace
  - to: [{podSelector: {}}]
  ingress:
  # Allow within namespace
  - from: [{podSelector: {}}]
