apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-egress
  namespace: production
spec:
  podSelector:
    matchLabels:
      internet-access: "true"   # Only pods with this label get internet
  policyTypes:
  - Egress
  egress:
  # Allow DNS
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS to anywhere on the internet
  - ports:
    - protocol: TCP
      port: 443
  # Allow HTTP (remove in production if not needed)
  - ports:
    - protocol: TCP
      port: 80
