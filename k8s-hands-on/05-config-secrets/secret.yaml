# WARNING: Kubernetes Secrets are base64 encoded, NOT encrypted by default.
# Enable Encryption at Rest or use Sealed Secrets / Vault in production.

# ── Opaque Secret (generic) ───────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: default
type: Opaque
data:
  username: YWRtaW4=         # echo -n 'admin' | base64
  password: UzNjdXIzUEBzcyE= # echo -n 'S3cur3P@ss!' | base64
---
# ── TLS Secret ────────────────────────────────────────────────────────────────
# Create with: kubectl create secret tls webapp-tls --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: webapp-tls
type: kubernetes.io/tls
data:
  tls.crt: <base64-encoded-cert>   # Replace with actual base64 cert
  tls.key: <base64-encoded-key>    # Replace with actual base64 key
---
# ── Pod using Secrets ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
  - name: app
    image: nginx:1.25

    # Method 1: Secret as env vars
    env:
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: username
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: password

    # Method 2: All keys from secret as env vars
    envFrom:
    - secretRef:
        name: db-secret

    # Method 3: Secret mounted as files (preferred for certs, tokens)
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true

  volumes:
  - name: secret-volume
    secret:
      secretName: db-secret
      defaultMode: 0400   # Read-only for owner only
