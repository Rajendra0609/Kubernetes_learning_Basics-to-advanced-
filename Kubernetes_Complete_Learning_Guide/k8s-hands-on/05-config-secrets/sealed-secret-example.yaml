# ============================================================
# External Secrets & Sealed Secrets Patterns
# ============================================================
# Problem: Raw Kubernetes Secrets are base64, NOT encrypted.
# Committing them to Git exposes credentials.
#
# Solution 1: Sealed Secrets (Bitnami) — encrypt with cluster key,
#   safe to commit to Git. kubectl seal encrypts; controller decrypts.
#
# Solution 2: External Secrets Operator — sync from AWS SSM,
#   HashiCorp Vault, GCP Secret Manager, Azure Key Vault.
# ============================================================

# ── OPTION A: Sealed Secret (after installing sealed-secrets controller) ──
# Install controller:
#   helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#   helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#
# Encrypt a secret:
#   kubectl create secret generic db-secret \
#     --from-literal=password=supersecret --dry-run=client -o yaml | \
#     kubeseal --format yaml > sealed-db-secret.yaml
#
# The output (safe to commit to Git):
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-credentials
  namespace: production
spec:
  encryptedData:
    # This value is encrypted with the cluster's public key
    # It was generated by: echo -n 'supersecret' | kubeseal --raw --from-file=/dev/stdin --namespace production --name db-credentials
    password: AgBy8hCe...truncated...ENCRYPTED_VALUE_HERE
    username: AgBf9kDd...truncated...ENCRYPTED_VALUE_HERE
  template:
    metadata:
      name: db-credentials
      namespace: production
    type: Opaque
---
# ── OPTION B: External Secrets Operator — pull from AWS SSM ──
# Install:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace

# Step 1: Create SecretStore (tells ESO where secrets live)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-ssm-store
  namespace: production
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1   # Mumbai region for Indian deployments
      auth:
        # Uses pod's IRSA (IAM Role for Service Account) — no static keys!
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
# Step 2: ExternalSecret — maps SSM path to a K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: production
spec:
  refreshInterval: 1h          # re-sync every hour
  secretStoreRef:
    name: aws-ssm-store
    kind: SecretStore
  target:
    name: db-credentials       # name of the K8s Secret to create
    creationPolicy: Owner      # ESO owns/manages the secret lifecycle
  data:
  - secretKey: password        # key in the K8s Secret
    remoteRef:
      key: /production/myapp/db/password    # SSM Parameter path
  - secretKey: username
    remoteRef:
      key: /production/myapp/db/username
---
# ── OPTION C: Vault Agent Injector (HashiCorp Vault) ──
# Vault injects secrets as files via init/sidecar containers
# The annotation approach requires vault-agent-injector running in cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-injected-app
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-injected-app
  template:
    metadata:
      labels:
        app: vault-injected-app
      annotations:
        # These annotations trigger the Vault Agent sidecar injector
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "myapp-role"
        vault.hashicorp.com/agent-inject-secret-db-creds.txt: "secret/data/production/db"
        vault.hashicorp.com/agent-inject-template-db-creds.txt: |
          {{- with secret "secret/data/production/db" -}}
          export DB_PASSWORD="{{ .Data.data.password }}"
          export DB_USERNAME="{{ .Data.data.username }}"
          {{- end }}
    spec:
      serviceAccountName: vault-auth-sa
      containers:
      - name: app
        image: myapp:latest
        command: ["/bin/sh", "-c"]
        args: ["source /vault/secrets/db-creds.txt && ./start.sh"]
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
