# ============================================================
# Prometheus + Grafana Stack — kube-prometheus-stack
# ============================================================
# Install the full monitoring stack with one Helm command:
#
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f kube-prometheus-stack-values.yaml
#
# This installs: Prometheus, Alertmanager, Grafana, node-exporter,
#   kube-state-metrics, Prometheus Operator
# ============================================================

# ── Helm values for kube-prometheus-stack ────────────────────
# Save this as kube-prometheus-stack-values.yaml and pass to helm

# (This is the values override — not a K8s manifest)
# ---
# grafana:
#   adminPassword: "changeme"
