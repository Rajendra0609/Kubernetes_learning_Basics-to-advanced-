apiVersion: v1
kind: Pod
metadata:
  name: app-with-sidecar
  labels:
    app: myapp
    tier: backend
spec:
  initContainers:
  - name: init-config
    image: busybox:1.35
    command: ['sh', '-c', 'echo Init complete > /shared/ready.txt']
    volumeMounts:
    - name: shared-data
      mountPath: /shared

  containers:
  - name: main-app
    image: nginx:1.25
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "128Mi"
        cpu: "200m"
    volumeMounts:
    - name: shared-data
      mountPath: /usr/share/nginx/html
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      successThreshold: 1

  - name: log-sidecar
    image: busybox:1.35
    command: ['sh', '-c', 'while true; do date >> /shared/access.log; sleep 5; done']
    volumeMounts:
    - name: shared-data
      mountPath: /shared

  volumes:
  - name: shared-data
    emptyDir: {}
