# ============================================================
# GitHub Actions CI/CD Pipeline — Build, Test, Deploy to K8s
# Save as: .github/workflows/deploy.yaml in your app repo
# ============================================================

name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Run tests ───────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: pip install -r requirements.txt -r requirements-test.txt

    - name: Run unit tests
      run: pytest tests/unit --cov=src --cov-report=xml

    - name: Run integration tests
      run: pytest tests/integration
      env:
        DATABASE_URL: postgresql://test:test@localhost/testdb

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml

  # ── Job 2: Build and push Docker image ────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=semver,pattern={{version}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64   # multi-arch build

    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        exit-code: '1'    # fail the build on HIGH/CRITICAL CVEs

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

  # ── Job 3: Deploy to staging ───────────────────────────────
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v3

    - name: Set kubeconfig
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml

    - name: Deploy with Helm
      run: |
        helm upgrade --install myapp ./helm/myapp \
          --namespace staging \
          --create-namespace \
          --set image.tag=${{ github.sha }} \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          -f helm/myapp/values-staging.yaml \
          --wait \
          --timeout 5m

    - name: Run smoke tests
      run: |
        kubectl wait --for=condition=available deployment/myapp -n staging --timeout=120s
        kubectl run smoke-test --image=curlimages/curl --restart=Never -n staging \
          --command -- curl -sf http://myapp.staging.svc.cluster.local/healthz
        kubectl wait --for=condition=complete job/smoke-test -n staging --timeout=60s || \
          (kubectl logs smoke-test -n staging && exit 1)
        kubectl delete pod smoke-test -n staging

  # ── Job 4: Deploy to production (manual approval) ─────────
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://myapp.example.com
    steps:
    - uses: actions/checkout@v4

    - name: Deploy with Helm (production)
      env:
        KUBECONFIG_DATA: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      run: |
        echo "$KUBECONFIG_DATA" | base64 -d > kubeconfig.yaml
        export KUBECONFIG=kubeconfig.yaml
        helm upgrade --install myapp ./helm/myapp \
          --namespace production \
          --set image.tag=${{ github.sha }} \
          --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
          -f helm/myapp/values-prod.yaml \
          --atomic \        # rolls back automatically if deployment fails
          --timeout 10m
