# ============================================================
# RBAC for the WebApp Operator
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-operator
  namespace: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webapp-operator
rules:
- apiGroups: [apps.example.com]
  resources: [webapps, webapps/status, webapps/scale]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [services, endpoints]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [networking.k8s.io]
  resources: [ingresses]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webapp-operator
roleRef:
  kind: ClusterRole
  name: webapp-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: webapp-operator
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-operator
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-operator
  template:
    metadata:
      labels:
        app: webapp-operator
    spec:
      serviceAccountName: webapp-operator
      containers:
      - name: operator
        image: myrepo/webapp-operator:1.0.0
        command: [kopf, run, /operator/operator-controller.py, --all-namespaces]
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 256Mi }
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
